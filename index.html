<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>calculator</title>
        <link rel="stylesheet" href="./styles.css">
        <script src="./scripts.js" defer></script>
    </head>

    <body>
        <div id="page-container">
            <header>
                <h1 id="header-hero">Calculator</h1>
            </header>
            <main>
                <div id='calculator'>
                    <div id='screen'>
                        <p id='prev-row'></p>
                        <p id='curr-row'></p>
                    </div>
                    <div id='buttons'>
                        <div class='row'>
                            <button type="button" class='large-button' id='clear-button'>Clear</button>
                            <button type="button"  class='large-button' id='delete-button'>Delete</button>
                        </div>
                        <div class='row'>
                            <button type="button" class='small-button' id='seven-button'>7</button>
                            <button type="button" class='small-button' id='eight-button'>8</button>
                            <button type="button" class='small-button' id='nine-button'>9</button>
                            <button type="button" class='small-button' id='divide-button'>/</button>
                        </div>
                        <div class='row'>
                            <button type="button" class='small-button' id='four-button'>4</button>
                            <button type="button" class='small-button' id='five-button'>5</button>
                            <button type="button" class='small-button' id='six-button'>6</button>
                            <button type="button" class='small-button' id='multiply-button'>*</button>
                        </div>
                        <div class='row'>
                            <button type="button" class='small-button' id='one-button'>1</button>
                            <button type="button" class='small-button' id='two-button'>2</button>
                            <button type="button" class='small-button' id='three-button'>3</button>
                            <button type="button" class='small-button' id='subtract-button'>-</button>
                        </div>
                        <div class='row'>
                            <button type="button" class='small-button' id='decimal-button'>.</button>
                            <button type="button" class='small-button' id='zero-button'>0</button>
                            <button type="button" class='small-button' id='equals-button'>=</button>
                            <button type="button" class='small-button' id='plus-button'>+</button>
                        </div>
                        
                        
                    </div>
                </div>
            </main>
            <footer>
                <h1 id="footer-hero">Thanks for using my app!</h1>
            </footer>
        </div>
    </body>
</html>
